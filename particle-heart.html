<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>قلب ذره‌ای - کنترل با دست</title>
<style>
  :root{ --glow:#ff2d6b; --bg:#020006; box-sizing:border-box; }
  html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;font-family:Tahoma,'Segoe UI',sans-serif;}
  canvas#c{display:block;width:100%;height:100%;}
  .ui{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:0;right:0;display:flex;justify-content:space-between;padding:0 14px;pointer-events:none;z-index:5;gap:10px;flex-wrap:wrap;}
  .pill{pointer-events:auto;background:rgba(10,4,14,.6);backdrop-filter:blur(6px);border:1px solid rgba(255,45,107,.35);border-radius:14px;padding:10px 16px;color:#fff;font-size:13px;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;}
  .dot{width:8px;height:8px;border-radius:50%;background:#555;flex:none;transition:.3s;}
  .dot.on{background:#2be86b;box-shadow:0 0 8px #2be86b;}
  .hint{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:#ffb3c6;font-size:12px;opacity:.75;z-index:5;pointer-events:none;}
  video{display:none;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<video id="video" playsinline></video>

<div class="ui">
  <div class="pill" id="camBtn"><span class="dot" id="camDot"></span><span id="camLabel">فعال‌سازی دوربین</span></div>
  <div class="pill" id="statusPill" style="pointer-events:none;">دوربین را روشن کن</div>
</div>
<div class="hint">فقط با دست جلوی دوربین کنترل می‌شود — ماوس اثری ندارد</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W,H,DPR;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1,2);
  W = canvas.clientWidth = window.innerWidth;
  H = canvas.clientHeight = window.innerHeight;
  canvas.width = W*DPR; canvas.height = H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  buildTargets();
}
window.addEventListener('resize', resize);

const N = 1400;
let particles = [];
let heartPts = [];

function heartPoint(t,scale){
  const x = 16*Math.pow(Math.sin(t),3);
  const y = 13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t);
  return {x:x*scale, y:-y*scale};
}
function buildTargets(cx, cy){
  cx = cx===undefined ? W/2 : cx;
  cy = cy===undefined ? H/2 : cy;
  const scale = Math.min(W,H)/38;
  heartPts = [];
  for(let i=0;i<N;i++){
    const t = Math.random()*Math.PI*2;
    const p = heartPoint(t,scale);
    const jitter = Math.random()*0.12;
    heartPts.push({x:cx+p.x*(1-jitter), y:cy+p.y*(1-jitter)});
  }
  particles.forEach((pt,i)=>{ pt.tx = heartPts[i].x; pt.ty = heartPts[i].y; });
}
for(let i=0;i<N;i++){
  particles.push({
    x:Math.random()*window.innerWidth, y:Math.random()*window.innerHeight,
    sx:0, sy:0, tx:0, ty:0, vx:0, vy:0,
    r:Math.random()*1.6+0.6, hue:Math.random()<0.7?340:285, ph:Math.random()*Math.PI*2
  });
}
resize();
particles.forEach(p=>{ p.sx = Math.random()*W; p.sy = Math.random()*H; });

let cohesion = 0, cohesionTarget = 0;
let handCx = W/2, handCy = H/2;
let smoothCx = W/2, smoothCy = H/2;

let t0 = performance.now();
function animate(now){
  const dt = Math.min((now-t0)/16.6,2); t0 = now;
  cohesion += (cohesionTarget - cohesion)*0.06*dt;
  smoothCx += (handCx - smoothCx)*0.08*dt;
  smoothCy += (handCy - smoothCy)*0.08*dt;
  if(cohesion>0.05) buildTargets(smoothCx, smoothCy);

  ctx.fillStyle = 'rgba(2,0,6,0.28)';
  ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation = 'lighter';

  const time = now*0.001;
  for(const p of particles){
    const tx = p.sx + (p.tx - p.sx)*cohesion;
    const ty = p.sy + (p.ty - p.sy)*cohesion;
    p.vx += (tx-p.x)*0.02; p.vy += (ty-p.y)*0.02;
    p.vx += Math.sin(time*1.5+p.ph)*0.03;
    p.vy += Math.cos(time*1.3+p.ph)*0.03;
    p.vx *= 0.9; p.vy *= 0.9;
    p.x += p.vx; p.y += p.vy;

    const glow = 0.5+cohesion*0.5;
    const rad = p.r*(1+cohesion*0.6);
    const grad = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,rad*4);
    grad.addColorStop(0, `hsla(${p.hue},100%,65%,${0.9*glow})`);
    grad.addColorStop(1, `hsla(${p.hue},100%,50%,0)`);
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(p.x,p.y,rad*4,0,Math.PI*2); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

// ---- webcam + MediaPipe hand tracking (only input, no mouse) ----
const camBtn = document.getElementById('camBtn');
const camDot = document.getElementById('camDot');
const camLabel = document.getElementById('camLabel');
const statusPill = document.getElementById('statusPill');
const videoEl = document.getElementById('video');
let cameraOn = false, mpCamera = null;

function fistCloseness(lm){
  const wrist = lm[0], palm = lm[9];
  const ref = Math.hypot(palm.x-wrist.x, palm.y-wrist.y) || 0.001;
  const tips = [4,8,12,16,20];
  let avg = 0;
  tips.forEach(i=>{ avg += Math.hypot(lm[i].x-palm.x, lm[i].y-palm.y); });
  avg /= tips.length;
  const ratio = avg/ref;
  return Math.max(0, Math.min(1, 1-(ratio-0.75)/(1.9-0.75)));
}

const hands = new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${f}`});
hands.setOptions({maxNumHands:1, modelComplexity:0, minDetectionConfidence:0.6, minTrackingConfidence:0.5});
hands.onResults(res=>{
  if(res.multiHandLandmarks && res.multiHandLandmarks.length){
    const lm = res.multiHandLandmarks[0];
    const close = fistCloseness(lm);
    cohesionTarget = close;
    // mirror x because selfie view
    handCx = (1-lm[9].x)*W;
    handCy = lm[9].y*H;
    statusPill.textContent = close>0.55 ? '❤️ قلب در حال شکل‌گیری است' : '✋ دست خود را ببندید';
  } else {
    cohesionTarget = 0.05;
    statusPill.textContent = '👋 دست خود را جلوی دوربین بگیرید';
  }
});

camBtn.addEventListener('click', async()=>{
  if(cameraOn) return;
  try{
    camLabel.textContent = 'در حال اتصال...';
    mpCamera = new Camera(videoEl, {
      onFrame: async()=>{ await hands.send({image:videoEl}); },
      width:480, height:360
    });
    await mpCamera.start();
    cameraOn = true;
    camDot.classList.add('on');
    camLabel.textContent = 'دوربین فعال است';
  }catch(e){
    camLabel.textContent = 'خطا در دسترسی به دوربین';
  }
});
</script>
</body>
</html>
